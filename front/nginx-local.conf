events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # 정적 파일 (멀티페이지 HTML/CSS/JS)
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # API 요청 → Spring Boot 컨테이너로 프록시
        location /bn/ {
            proxy_pass http://bn-container:8080/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI — springdoc이 절대경로(/v3/api-docs)로 문서를 요청하므로
        # /bn/ prefix 없이 루트 경로 그대로 백엔드로 프록시한다.
        location /swagger-ui/ {
            proxy_pass http://bn-container:8080/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /v3/api-docs {
            proxy_pass http://bn-container:8080/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
